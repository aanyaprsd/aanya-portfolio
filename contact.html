<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Portfolio website for Aanya Prasad, a computer science student at UT Dallas."
    >

    <title>Aanya Prasad | Portfolio</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/contact.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar">
            <a class="logo" href="index.html">AP</a>

            <ul class="nav-links">
                <li><a href="about.html">About</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-page">
            <div class="contact-intro">
                <h1>Let's connect.</h1>

                <p class="hero-description">
                    Have a question? <br>
                    Interested in collaborating? <br>
                    Looking for an intern?<br><br>
                    I'd love to hear from you!
                </p>
            </div>
            
            <section id="contact" class="contact-section">
                <div class = "contact-form-container">
                    <form class="contact-form">
                        <div class="form-field">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-field">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" name="subject">
                        </div>

                        <div class="form-field">
                            <label for="message">Message</label>
                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                required
                            ></textarea>
                        </div>

                        <button class="button secondary-button" type="submit">
                            Send Message
                        </button>
                    </form>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; <span id="current-year"></span> Aanya Prasad</p>

            <div class="social-links">
                <a
                    href="https://www.linkedin.com/in/aanya-prasad-876735283/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit my LinkedIn profile"
                >
                    <img
                        src="assets/images/linkedin.png"
                        alt="LinkedIn"
                        class="social-icon"
                    >
                </a>
                <a
                    href="https://github.com/aanyaprsd"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit my GitHub profile"
                >
                    <img
                        src="assets/images/github.png"
                        alt="GitHub"
                        class="social-icon"
                    >
                </a>
            </div>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
